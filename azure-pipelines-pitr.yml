trigger: none
pr: none

pool:
  vmImage: "ubuntu-latest"

parameters:
  - name: RestoreDateTime
    displayName: "Target Restore Date/Time (UK LOCAL TIME)"
    type: string
    default: "2026-04-24 10:00:00" # a template for the user

stages:
  - stage: Validation
    displayName: "Pre-Flight Validation"
    jobs:
      - job: ValidateInput
        steps:
          - task: AzureCLI@2
            name: ValidateStep
            displayName: "Validate Restore Window"
            inputs:
              azureSubscription: "vaccs-mya-dev-uks"
              scriptType: "pscore"
              scriptLocation: "scriptPath"
              scriptPath: "$(Build.SourcesDirectory)/scripts/disaster-recovery/validate-cosmos-pitr.ps1"
              arguments: >
                -sourceAccount "vaccs-mya-cdb-dev-uks"
                -resourceGroup "vaccs-mya-dev-uks"
                -restoreDateAndTimeStr "${{ parameters.RestoreDateTime }}"

  - stage: StopWebApp
    displayName: "Stop Applications"
    dependsOn: Validation
    jobs:
      - job: StopApps
        steps:
          - task: AzureCLI@2
            displayName: "Stop Applications"
            inputs:
              azureSubscription: "vaccs-mya-dev-uks"
              scriptType: "pscore"
              scriptLocation: scriptPath
              scriptPath: "$(Build.SourcesDirectory)/scripts/disaster-recovery/stop-dev-app-services.ps1"
              arguments: "-resourceGroup vaccs-mya-dev-uks -region uks"

  - stage: CosmosPITR
    displayName: "Perform Cosmos DB PITR"
    dependsOn: 
      - StopWebApp
      - Validation

    variables:
      RestoreTimeUtc: $[ stageDependencies.Validation.ValidateInput.outputs['ValidateStep.ConvertedUtcTime'] ]
    jobs:
      - job: RestoreCosmos
        steps:
          - task: AzureCLI@2
            displayName: "Execute Restore"
            inputs:
              azureSubscription: "vaccs-mya-dev-uks"
              scriptType: "pscore"
              scriptLocation: "inlineScript"
              inlineScript: |
                az cosmosdb restore `
                  --account-name "vaccs-mya-cdb-dev-uks" `
                  --resource-group "vaccs-mya-dev-uks" `
                  --target-database-account-name "vaccs-mya-cdb-dev-uks-secondary" `
                  --location "uksouth" `
                  --restore-timestamp "$(RestoreTimeUtc)"

  - stage: UpdateConfig
    displayName: "Update ActiveCosmosDBAccountName in Key Vault "
    dependsOn: CosmosPITR
    jobs:
      - job: Update
        steps:
          - task: AzureCLI@2
            displayName: "Update KV Secret"
            inputs:
              azureSubscription: "vaccs-mya-dev-uks"
              scriptType: "pscore"
              scriptLocation: "inlineScript"
              inlineScript: |
                $vaultName = "vaccs-mya-kv-dev-uks"
                $secretName = "ActiveCosmosDBAccountName"
                $newDbName = "vaccs-mya-cdb-dev-uks-secondary"

                Write-Host "Upserting secret '$secretName' in vault '$vaultName'..."
                az keyvault secret set --vault-name $vaultName --name $secretName --value $newDbName

                Write-Host "PITR Switchover Complete. Functions are now pointing to: $newDbName"

  # new stage, restart requires approval
  # something like this
  # Write-Host "Restarting Function App: $functionAppName..."
  # az functionapp restart --name $functionAppName --resource-group $resourceGroup
